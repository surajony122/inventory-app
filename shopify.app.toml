# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "62d74d928297d3099a02f2357bd108d0"
name = "Unnicharya "
application_url = "https://unnicharya-app.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "orders/create", "orders/updated", "orders/paid", "orders/cancelled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_inventory,read_orders,write_inventory,write_metaobject_definitions,write_metaobjects,write_orders,write_products"

[auth]
redirect_urls = [ "https://unnicharya-app.onrender.com/auth" ]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[metaobjects.app.checkout_block]
name = "Checkout block"
description = "Coupons and notes shown at checkout, managed from the Unnicharya team portal"
display_name_field = "title"

  [metaobjects.app.checkout_block.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[metaobjects.app.checkout_block.fields.kind]
name = "Kind"
type = "single_line_text_field"
required = true

[metaobjects.app.checkout_block.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.checkout_block.fields.body]
name = "Body"
type = "multi_line_text_field"

[metaobjects.app.checkout_block.fields.code]
name = "Code"
type = "single_line_text_field"

[metaobjects.app.checkout_block.fields.active]
name = "Active"
type = "boolean"

[metaobjects.app.checkout_block.fields.sort]
name = "Sort"
type = "number_integer"
